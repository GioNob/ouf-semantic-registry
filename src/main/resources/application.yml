spring:
  application.name: ouf-semantic-registry
  http.converters.preferred-json-mapper: jackson2
  datasource:
    url: ${OUF_SEM_DB_URL:jdbc:postgresql://127.0.0.1:5432/ouf_semantic}
    username: ${OUF_SEM_DB_USER}
    password: ${OUF_SEM_DB_PASSWORD}
  flyway:
    enabled: true
    schemas: ouf_sem
    default-schema: ouf_sem
management:
  endpoints.web.exposure.include: health,info,prometheus,metrics
  endpoint.health.probes.enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  observations:
    key-values:
      module: semantic-registry
  prometheus:
    metrics:
      export:
        enabled: true
server:
  port: ${PORT:8080}
ouf:
  semantic:
    reference-batch:
      max-request-bytes: ${OUF_SEM_REFERENCE_BATCH_MAX_REQUEST_BYTES:262144}
      max-items: ${OUF_SEM_REFERENCE_BATCH_MAX_ITEMS:1024}
    published-batch:
      enabled: ${OUF_SEM_PUBLISHED_BATCH_ENABLED:true}
      max-intents: ${OUF_SEM_PUBLISHED_BATCH_MAX_INTENTS:64}
      max-hits: ${OUF_SEM_PUBLISHED_BATCH_MAX_HITS:3}
      max-request-bytes: ${OUF_SEM_PUBLISHED_BATCH_MAX_REQUEST_BYTES:65536}
      max-response-bytes: ${OUF_SEM_PUBLISHED_BATCH_MAX_RESPONSE_BYTES:262144}
    providers:
      schema-gov:
        enabled: ${OUF_SCHEMA_GOV_ENABLED:false}
        namespace-prefixes: "${OUF_SCHEMA_GOV_NAMESPACE_PREFIXES:https://w3id.org/italia/onto/}"
        gateway-base-url: ${OUF_SCHEMA_GOV_GATEWAY_BASE_URL:}
        # Deployment bindings: the Gateway owns the concrete schema.gov.it routes.
        # No undocumented public endpoint is hard-coded in this module.
        search-path: ${OUF_SCHEMA_GOV_SEARCH_PATH:/semantic-providers/schema-gov/sparql}
        fetch-path: ${OUF_SCHEMA_GOV_FETCH_PATH:/semantic-providers/schema-gov/fetch}
        origin-attestation:
          public-key: ${OUF_SCHEMA_GOV_429_PUBLIC_KEY:}
          installation-id: ${OUF_SCHEMA_GOV_429_INSTALLATION_ID:}
          clock-skew-seconds: ${OUF_SCHEMA_GOV_429_CLOCK_SKEW_SECONDS:0}
        gateway-auth:
          enabled: ${OUF_SCHEMA_GOV_GATEWAY_AUTH_ENABLED:false}
          token-endpoint: ${OUF_SCHEMA_GOV_TOKEN_ENDPOINT:}
          client-id: ${OUF_SCHEMA_GOV_CLIENT_ID:}
          client-secret-file: ${OUF_SCHEMA_GOV_CLIENT_SECRET_FILE:}
          scope: ${OUF_SCHEMA_GOV_WORKLOAD_SCOPE:}
          request-timeout: ${OUF_SCHEMA_GOV_TOKEN_TIMEOUT:5s}
          refresh-skew: ${OUF_SCHEMA_GOV_TOKEN_REFRESH_SKEW:10s}
          max-response-bytes: ${OUF_SCHEMA_GOV_TOKEN_MAX_BYTES:32768}
        connect-timeout: 2s
        request-timeout: 5s
        max-response-bytes: 8388608
        max-candidates: 10
        max-attempts: 2
        retry-backoff: 100ms
        circuit-failure-threshold: 3
        circuit-open-duration: 30s
    discovery-capacity:
      installation-id: ${OUF_DISCOVERY_INSTALLATION_ID:default}
      logical-provider-id: ${OUF_DISCOVERY_LOGICAL_PROVIDER_ID:SCHEMA_GOV_IT}
      profile-version: ${OUF_DISCOVERY_CAPACITY_VERSION:1}
      provider-slots: 1
      installation-provider-in-flight: ${OUF_DISCOVERY_INSTALLATION_PROVIDER_IN_FLIGHT:1}
      slot-max-seconds: ${OUF_DISCOVERY_SLOT_MAX_SECONDS:60}
      slot-wait-max-seconds: ${OUF_DISCOVERY_SLOT_WAIT_MAX_SECONDS:30}
      reconciliation-timeout-seconds: ${OUF_DISCOVERY_RECONCILIATION_TIMEOUT_SECONDS:300}
    discovery-worker:
      enabled: ${OUF_DISCOVERY_WORKER_ENABLED:true}
      fixed-delay: ${OUF_DISCOVERY_WORKER_DELAY:2s}
