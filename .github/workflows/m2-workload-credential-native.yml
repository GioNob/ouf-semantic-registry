name: M2 exact native provider credential contract
on:
  push:
    paths: ['src/main/java/it/comune/trieste/ouf/semantic/adapters/discovery/ClientCredentialsTokenSource.java','src/test/java/it/comune/trieste/ouf/semantic/adapters/discovery/ClientCredentialsTokenSourceTest.java','src/test/java/it/comune/trieste/ouf/semantic/adapters/discovery/MountedGatewayCredentialNativeProbe.java','scripts/qualify-mounted-gateway-credential.py','.github/workflows/m2-workload-credential-native.yml']
  pull_request:
    paths: ['src/main/java/it/comune/trieste/ouf/semantic/adapters/discovery/ClientCredentialsTokenSource.java','src/test/java/it/comune/trieste/ouf/semantic/adapters/discovery/ClientCredentialsTokenSourceTest.java','src/test/java/it/comune/trieste/ouf/semantic/adapters/discovery/MountedGatewayCredentialNativeProbe.java','scripts/qualify-mounted-gateway-credential.py','.github/workflows/m2-workload-credential-native.yml']
permissions: {contents: read}
jobs:
  native-file-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - name: Compile actual retained client and disposable native probe
        run: |
          set -euo pipefail
          bash scripts/install-authorization-sdk.sh
          timeout 8m mvn -B -ntp -DskipTests package
          timeout 3m mvn -B -ntp org.apache.maven.plugins:maven-dependency-plugin:3.8.1:build-classpath -DincludeScope=test -Dmdep.outputFile=target/native-classpath.txt
      - name: Exact root service-group and owner-private contracts as UID10001
        run: |
          set -euo pipefail
          native_java="$(readlink -f "$(command -v java)")"
          sudo env GITHUB_ACTIONS=true OUF_NATIVE_JAVA="$native_java" \
            OUF_NATIVE_CREDENTIAL_FIXTURE="/var/lib/ouf-native-provider-credential-${GITHUB_RUN_ID}" \
            python3 -I -B -S scripts/qualify-mounted-gateway-credential.py
