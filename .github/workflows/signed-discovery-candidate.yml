name: Signed semantic discovery candidate
on:
  workflow_dispatch:
  push:
    branches: [codex/discovery-java-runtime-security-20261009]
    paths: [.github/workflows/signed-discovery-candidate.yml]
permissions:
  contents: read
  attestations: write
  id-token: write
concurrency:
  group: ouf-oss-semantic-candidate
  cancel-in-progress: false
jobs:
  build-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: GioNob/ouf-semantic-registry
          ref: 403531a9df1cbc877078f8126fd1fc4ff18acea9
          path: semantic-source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: GioNob/ouf-semantic-registry
          ref: 84e91e199892bfda1d116a49f53a9990f61724c7
          path: verification-source
          persist-credentials: false
      - name: Build exact non-root OSS Semantic candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C semantic-source rev-parse HEAD)" = 403531a9df1cbc877078f8126fd1fc4ff18acea9
          docker build --label org.opencontainers.image.revision=403531a9df1cbc877078f8126fd1fc4ff18acea9 -t ouf-semantic:oss-ae30d65 semantic-source
          test "$(docker image inspect ouf-semantic:oss-ae30d65 --format '{{.Config.User}}')" = 10001:10001
          docker run --rm --entrypoint /bin/sh ouf-semantic:oss-ae30d65 -c 'test ! -e /usr/bin/pebble && java -version'
          mkdir package
          docker save ouf-semantic:oss-ae30d65 > package/semantic.image.tar
          docker image inspect ouf-semantic:oss-ae30d65 > package/build-image.json
      - name: Bind the exact fresh database from the remediation source
        run: cp docs/discovery-remediation-database-pin-20261009.json verification-source/docs/discovery-remediation-database-pin-20261009.json
      - name: Prepare existing pinned offline scanners
        run: sudo /usr/bin/python3 -B verification-source/tests/prepare_native_vulnerability_scanners.py --database-pin verification-source/docs/discovery-remediation-database-pin-20261009.json
      - name: Verify exact image identity and fresh vulnerability threshold
        shell: bash
        run: |
          sudo /usr/bin/python3 -B - <<'PY'
          import ast, base64, gzip, hashlib, json, os, subprocess, sys, tarfile
          from pathlib import Path
          sys.path.insert(0, str(Path("verification-source").resolve()))
          from tools import verify_semantic_image_archive as archive
          def verify_general_image(path, expected_id):
              # Read archive members only; no rootfs files are extracted or executed.
              blobs, names = {}, set()
              with tarfile.open(path, "r:") as bundle:
                  members = bundle.getmembers()
                  assert len(members) <= 512
                  for entry in members:
                      name = archive.path_name(entry.name)
                      assert name not in names
                      names.add(name)
                      if entry.isdir():
                          continue
                      assert entry.isfile() and 0 <= entry.size <= 2147483648
                      source = bundle.extractfile(entry)
                      prefix = source.read(min(entry.size, 512))
                      h = hashlib.sha256(prefix)
                      metadata = prefix.lstrip().startswith((b"{", b"["))
                      chunks = [prefix] if metadata else []
                      if metadata:
                          assert entry.size <= 2097152
                      while chunk := source.read(65536):
                          h.update(chunk)
                          if metadata:
                              chunks.append(chunk)
                      row = {"sha256":h.hexdigest(), "size":entry.size}
                      if name.startswith("blobs/sha256/"):
                          assert name == "blobs/sha256/" + row["sha256"]
                      if metadata:
                          row["json"] = archive.json_bytes(b"".join(chunks))
                      else:
                          stream = bundle.extractfile(entry)
                          if prefix.startswith(bytes.fromhex("1f8b")):
                              stream = gzip.GzipFile(fileobj=stream)
                          diff = hashlib.sha256()
                          size = 0
                          while chunk := stream.read(65536):
                              size += len(chunk)
                              assert size <= 2147483648
                              diff.update(chunk)
                          row["diffId"] = "sha256:" + diff.hexdigest()
                      blobs[name] = row
                  manifests = blobs["manifest.json"]["json"]
                  assert len(manifests) == 1
                  item = manifests[0]
                  config = blobs[archive.path_name(item["Config"])]
                  doc = config["json"]
                  layers = item["Layers"]
                  diffs = doc["rootfs"]["diff_ids"]
                  assert doc["rootfs"]["type"] == "layers"
                  assert len(layers) == len(diffs) and 1 <= len(layers) <= 256
                  assert len(set(layers)) == len(layers)
                  assert (doc["os"], doc["architecture"]) == ("linux", "amd64")
                  for name, expected in zip(layers, diffs):
                      assert blobs[archive.path_name(name)]["diffId"] == expected
                  kind = archive.image_identity_binding(blobs, expected_id, config, layers, ("linux", "amd64"))
                  return {"configByteSha256":config["sha256"], "imageIdentityBindingKind":kind}
          
          verify = verify_general_image
          root = Path("/root/ouf-oss-semantic")
          root.mkdir(mode=0o700)
          output = Path("package").resolve()
          image = json.loads((output / "build-image.json").read_bytes())[0]
          verified = verify(output / "semantic.image.tar", image["Id"])
          home = root / "home"
          home.mkdir(mode=0o700)
          env = {"PATH":"/usr/bin:/bin", "HOME":str(home), "XDG_CONFIG_HOME":str(home), "SYFT_CHECK_FOR_APP_UPDATE":"false", "SYFT_PACKAGE_EXCLUDE_BINARY_OVERLAP_BY_OWNERSHIP":"false"}
          syft = output / "semantic.syft.json"
          subprocess.run(["/usr/bin/unshare","--net","--","/root/ouf-ci-vulnerability/syft","scan","docker-archive:"+str(output/"semantic.image.tar"),"--quiet","-o","syft-json="+str(syft)],env=env,check=True,timeout=180)
          sbom = json.loads(syft.read_bytes())
          assert sbom["source"]["metadata"]["imageID"] == "sha256:" + verified["configByteSha256"]
          assert hashlib.sha256(base64.b64decode(sbom["source"]["metadata"]["config"],validate=True)).hexdigest() == verified["configByteSha256"]
          scan = subprocess.run(["/usr/bin/python3","-B","verification-source/tests/scan_semantic_extended_inventory.py","--sbom",str(syft)],capture_output=True,check=True,timeout=400)
          report = json.loads(scan.stdout)
          (output / "semantic.grype.json").write_bytes(scan.stdout)
          counts = {k:0 for k in ("Critical","High","Medium","Low","Negligible","Unknown")}
          for match in report["matches"]:
              counts[match["vulnerability"]["severity"]] += 1
          accepted = not any(counts[k] for k in ("Critical","High","Unknown")) and not report.get("alertsByPackage")
          result = {"schema":"ouf.semantic.oss-candidate.v1","sourceCommit":"403531a9df1cbc877078f8126fd1fc4ff18acea9","imageId":image["Id"],"archiveByteVerified":True,"runtimeUser":image["Config"]["User"],"severityCounts":counts,"thresholdMet":accepted,"releaseApplied":False,"acceptanceGranted":False,"publisherTrustAccepted":False}
          (output / "inventory.json").write_text(json.dumps(result,indent=2)+chr(10))
          print("OUF_OSS_SEMANTIC_CANDIDATE="+json.dumps(result,sort_keys=True))
          if not accepted:
              raise SystemExit("OSS_SEMANTIC_SCAN_BLOCKED")
          PY
      - name: Verify packaged migrations and exclude fixture identity from runtime
        run: |
          set -euo pipefail
          docker create --name semantic-package-proof ouf-semantic:oss-ae30d65
          docker cp semantic-package-proof:/app/application.jar package/application.jar
          docker rm semantic-package-proof
          python3 - <<'PY'
          import hashlib, zipfile
          from pathlib import Path
          source=Path("semantic-source/src/main/resources/db/migration")
          with zipfile.ZipFile("package/application.jar") as jar:
              for file in source.glob("*.sql"):
                  assert jar.read("BOOT-INF/classes/db/migration/"+file.name)==file.read_bytes()
              assert not any("it/comune/trieste/ouf/pairwise/" in name for name in jar.namelist())
              assert "BOOT-INF/lib/authorization-sdk-1.2.0.jar" in jar.namelist()
          print("OSS_SEMANTIC_PACKAGE=PASS")
          PY
          gzip -n package/semantic.image.tar
      - name: Make public build evidence readable
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" package
      - name: Bind exact archive and evidence digests
        run: |
          python3 - <<'PY'
          import hashlib, pathlib
          root=pathlib.Path('package')
          files=sorted(p for p in root.iterdir() if p.is_file())
          (root/'checksums.sha256').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+str(p)+'\n' for p in files))
          PY
      - name: Attest candidate bytes and scan evidence
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-checksums: package/checksums.sha256
          create-storage-record: false
      - name: Verify exact producer identity and retain signature
        env:
          GH_TOKEN: ${{ github.token }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$PROVENANCE_BUNDLE" package/provenance.json
          for file in semantic.image.tar.gz inventory.json semantic.syft.json semantic.grype.json build-image.json; do
            gh attestation verify "package/$file" --repo GioNob/ouf-semantic-registry --signer-workflow GioNob/ouf-semantic-registry/.github/workflows/signed-discovery-candidate.yml --source-digest "$GITHUB_SHA" --source-ref "$GITHUB_REF" --deny-self-hosted-runners --bundle "$PROVENANCE_BUNDLE" --format json > "package/$file.verification.json"
          done
          echo SIGNED_DISCOVERY_CANDIDATE_CRYPTO=PASS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signed-semantic-discovery-candidate-${{ github.run_id }}
          path: package/
          if-no-files-found: warn
          retention-days: 30
