name: Semantic Registry module CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      predecessor:
        description: Reviewed Semantic release commit
        required: false
        type: string
      predecessor_run:
        description: Run that produced the installed governed image
        required: false
        type: string
      predecessor_image_id:
        description: Docker image ID from the release record
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: semantic-registry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java21-postgresql17:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ouf_semantic
          POSTGRES_USER: ouf_semantic
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ouf_semantic -d ouf_semantic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      OUF_SEM_DB_URL: jdbc:postgresql://127.0.0.1:5432/ouf_semantic
      OUF_SEM_DB_USER: ouf_semantic
      OUF_SEM_DB_PASSWORD: ci-only-password
      OUF_DISCOVERY_WORKER_ENABLED: "false"
      OUF_DISCOVERY_GATEWAY_PAIRWISE_ROOT: ${{ github.workspace }}/.pairwise/discovery-gateway
      OUF_SEMANTIC_GATEWAY_PAIRWISE_ROOT: ${{ github.workspace }}/.pairwise/gateway
      MAVEN_OPTS: >-
        -Dmaven.wagon.http.connectionTimeout=10000
        -Dmaven.wagon.http.readTimeout=30000
        -Djava.net.preferIPv4Stack=true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: GioNob/ouf-api-gateway
          ref: 09c431be83a5d25ce4cc76d33aafea0ed1523702
          path: .pairwise/gateway
      - uses: actions/checkout@v4
        with:
          repository: GioNob/ouf-api-gateway
          ref: ace683b1019f79adaace86796b67e463b93ec12e
          path: .pairwise/discovery-gateway
      - name: Install actual Gateway receipt fixture dependencies
        # Both exporters run under the current fixture's pinned dependencies;
        # do not install conflicting historical versions into the same interpreter.
        run: python3 -m pip install -r .pairwise/gateway/requirements-dev.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify frozen source checksums
        run: |
          sha256sum -c evidence/source-checksums.txt
          python3 scripts/check-file-first-source-continuity.py
      - name: Validate cross-module evidence register
        run: python3 scripts/validate-pet-register.py
      - name: Compile, test and package with bounded Maven execution
        run: |
          bash scripts/install-authorization-sdk.sh
          timeout --signal=TERM --kill-after=30s 20m mvn -B -ntp clean verify
      - name: Assert test identity adapter is absent from production artifact
        run: |
          jar tf target/semantic-registry-*.jar > target/production-jar-entries.txt
          if grep -q "it/comune/trieste/ouf/pairwise/" target/production-jar-entries.txt; then
            echo "Test identity adapter leaked into production artifact" >&2
            exit 1
          fi
      - name: Record runner evidence
        if: always()
        env:
          CI_JOB_STATUS: ${{ job.status }}
          CI_RUN_ID: ${{ github.run_id }}
          CI_COMMIT_SHA: ${{ github.sha }}
        run: node scripts/write-ci-evidence.mjs
      - name: Verify runtime SDK packaging
        run: |
          jar tf target/semantic-registry-*.jar > target/sdk-packaging.txt
          grep -q 'BOOT-INF/lib/authorization-sdk-1.2.0.jar' target/sdk-packaging.txt
          if grep -q 'authorization-sdk-1.2.0-tests.jar' target/sdk-packaging.txt; then exit 1; fi
      - name: Upload test and build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-registry-java21-postgresql17-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            target/surefire-reports/
            target/*.jar
            target/ci-evidence.json
            evidence/source-checksums.txt
            evidence/acceptance-traceability.json

  container-smoke:
    needs: java21-postgresql17
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        run: |
          docker build \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --tag "ouf-semantic-registry:$GITHUB_SHA" .
      - name: Inspect image as non-root
        run: |
          test "$(docker image inspect "ouf-semantic-registry:$GITHUB_SHA" --format '{{.Config.User}}')" = "10001:10001"
      - name: Package the candidate for the predecessor-return job
        env:
          OUF_REVIEWED_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          umask 077
          image="ouf-semantic-registry:$GITHUB_SHA"
          mkdir -p target/governed-image
          scratch="$(mktemp -d)"
          container=
          cleanup() {
            if [[ -n "$container" ]]; then docker rm "$container" >/dev/null; fi
            rm -f "$scratch/application.jar"
            rmdir "$scratch"
          }
          trap cleanup EXIT
          container="$(docker create "$image")"
          docker cp "$container:/app/application.jar" "$scratch/application.jar"
          docker save "$image" | gzip -n > target/governed-image/image.tar.gz

          python3 - "$image" "$scratch/application.jar" <<'PYIMAGE'
          import hashlib
          import json
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path
          from zipfile import ZipFile

          def command(*args):
              return subprocess.check_output(args, text=True).strip()

          image, application_jar = sys.argv[1:]
          root = Path("target/governed-image")
          archive = root / "image.tar.gz"
          reviewed = os.environ["OUF_REVIEWED_SOURCE_COMMIT"]
          tested = command("git", "rev-parse", "HEAD")
          revision = command("docker", "image", "inspect", image, "--format",
                             '{{index .Config.Labels "org.opencontainers.image.revision"}}')
          if not re.fullmatch(r"[a-f0-9]{40}", reviewed) or tested != revision or tested != os.environ["GITHUB_SHA"]:
              raise SystemExit("Invalid source provenance for tested image")

          migrations = []
          with ZipFile(application_jar) as jar:
              for entry in sorted(jar.infolist(), key=lambda item: item.filename):
                  match = re.fullmatch(r"BOOT-INF/classes/db/migration/(V[^/]*\.sql)", entry.filename)
                  if match:
                      migrations.append({"name": match[1], "sha256": hashlib.sha256(jar.read(entry)).hexdigest()})
          if not migrations:
              raise SystemExit("No Flyway migrations found in the tested image")

          with archive.open("rb") as stream:
              archive_sha256 = hashlib.file_digest(stream, "sha256").hexdigest()
          manifest = {
              "schema": "ouf.semantic-tested-image.v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "reviewedSourceCommit": reviewed,
              "testedCommit": tested,
              "testedTree": command("git", "rev-parse", "HEAD^{tree}"),
              "workflowRunId": os.environ["GITHUB_RUN_ID"],
              "workflowRunAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "imageTag": image,
              "imageId": command("docker", "image", "inspect", image, "--format", "{{.Id}}"),
              "imageRevisionLabel": revision,
              "archiveName": archive.name,
              "archiveSha256": archive_sha256,
              "archiveBytes": archive.stat().st_size,
              "flywayMigrations": migrations,
              "qualifiedInCiOnly": True,
              "targetApplyAuthorized": False,
              "humanBudgetGranted": False,
              "releaseAcceptance": False,
          }
          (root / "manifest.json").write_text(json.dumps(manifest, sort_keys=True, separators=(",", ":")) + "\n")
          (root / "SHA256SUMS").write_text(f"{archive_sha256}  {archive.name}\n")
          PYIMAGE
      - name: Transfer the candidate within this CI run
        id: transfer
        uses: actions/upload-artifact@v4
        with:
          name: semantic-registry-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/governed-image/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
    outputs:
      candidate-artifact: ${{ steps.transfer.outputs.artifact-id }}

  predecessor-return:
    needs: container-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    # D-080 (sprint-03 task-58a): the T2 release line pins Semantic 36 in esercizio
    # (PR #65 f630cc5, run 45374573617, artifact 14911255788). Repository
    # variables are not read: they serve the other lines.
    env:
      PREDECESSOR_COMMIT: ${{ inputs.predecessor || 'f630cc5c92297aaaf1ebc27d15f28122e963d0ee' }}
      PREDECESSOR_RUN: ${{ inputs.predecessor_run || '45374573617' }}
      PREDECESSOR_IMAGE_ID: ${{ inputs.predecessor_image_id || 'sha256:292232234f8740a514b8a5cf3eebb4bd7cf12d2b0dc55d4b0f2cfa4c8fc5fab5' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the installed release pins
        run: |
          [[ "$PREDECESSOR_COMMIT" =~ ^[a-f0-9]{8,40}$ && "$PREDECESSOR_RUN" =~ ^[1-9][0-9]*$ && "$PREDECESSOR_IMAGE_ID" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::D-080 requires the reviewed commit, governed artifact run and installed Docker image ID."
            exit 1
          }
      - name: Retrieve the governed predecessor
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.PREDECESSOR_RUN }}
          name: semantic-registry-governed-image-${{ env.PREDECESSOR_RUN }}
          path: target/predecessor
      - name: Retrieve the candidate built by container-smoke
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.container-smoke.outputs.candidate-artifact }}
          merge-multiple: true
          path: target/governed-image
      - name: Exercise both release images on one PostgreSQL database
        run: bash scripts/predecessor-return/run.sh
      - name: Upload tested image without publishing a release
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: semantic-registry-governed-image-${{ github.run_id }}
          path: target/governed-image/
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

