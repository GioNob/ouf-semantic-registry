name: Semantic provider gateway fixture CI

on:
  push:
    paths:
      - pairwise/gateway-fixture/**
      - .github/workflows/gateway-fixture-ci.yml
  pull_request:
    paths:
      - pairwise/gateway-fixture/**
      - .github/workflows/gateway-fixture-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture-java21:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pairwise/gateway-fixture
    env:
      MAVEN_OPTS: -Dmaven.wagon.http.connectionTimeout=10000 -Dmaven.wagon.http.readTimeout=30000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: pairwise/gateway-fixture/pom.xml
      - name: Test and package fixture
        run: timeout --signal=TERM --kill-after=30s 12m mvn -B -ntp clean verify
      - name: Build and inspect non-root image
        run: |
          docker build --tag semantic-provider-gateway-fixture:${{ github.sha }} .
          test "$(docker image inspect semantic-provider-gateway-fixture:${{ github.sha }} --format '{{.Config.User}}')" = "10002:10002"
