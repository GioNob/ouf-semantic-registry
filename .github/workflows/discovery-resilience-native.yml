name: Discovery resilience native qualification
on:
  push:
    branches: [codex/discovery-durable-resilience-20261011]
  pull_request:
    paths:
      - src/main/java/it/comune/trieste/ouf/semantic/adapters/discovery/**
      - tests/ProviderFailurePolicyNative.java
      - .github/workflows/discovery-resilience-native.yml
permissions: {contents: read}
jobs:
  bounded-http-classification:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Compile actual adapter and native fixture
        run: |
          mkdir -p target/resilience-native
          javac --release 21 -d target/resilience-native src/main/java/it/comune/trieste/ouf/semantic/adapters/discovery/ProviderFailurePolicy.java src/main/java/it/comune/trieste/ouf/semantic/adapters/discovery/BoundedGatewayClient.java src/main/java/it/comune/trieste/ouf/semantic/adapters/discovery/BoundedResponseBody.java tests/ProviderFailurePolicyNative.java
      - name: Classify actual HTTP failures and bounded body timeout
        run: timeout --signal=TERM --kill-after=5s 30s java -cp target/resilience-native it.comune.trieste.ouf.semantic.adapters.discovery.ProviderFailurePolicyNative
