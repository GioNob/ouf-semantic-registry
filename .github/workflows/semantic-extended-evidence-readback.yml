name: Semantic extended evidence readback
on:
  pull_request:
    paths:
      - 'tools/verify_semantic_extended_evidence.py'
      - 'tests/test_semantic_extended_evidence_verification.py'
      - '.github/workflows/semantic-extended-evidence-readback.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify-downloaded-sidecar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify archive, image and report rejection tests
        run: python3 -B -m unittest tests.test_semantic_extended_inventory tests.test_semantic_static_module_coverage tests.test_semantic_extended_evidence_verification -v
      - name: Reverify unchanged original v2 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tests/qualify_semantic_downloaded_remediation_artifact.py --lock tests/semantic-downloaded-remediation-artifact.json
      - name: Download exact sidecar and portable verification CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api /repos/GioNob/ouf-semantic-registry/actions/artifacts/11433181340/zip > "$RUNNER_TEMP/extended-v2.zip"
          mkdir -m 700 "$RUNNER_TEMP/extended-gh"
          curl --fail --location --silent --show-error https://github.com/cli/cli/releases/download/v2.102.0/gh_2.102.0_linux_amd64.tar.gz > "$RUNNER_TEMP/extended-gh/gh.tar.gz"
          echo 'bb766f710eef8ede859c18578c72c327597cd4c8a85b06001b1f3843c6019386  '"$RUNNER_TEMP/extended-gh/gh.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/extended-gh/gh.tar.gz" -C "$RUNNER_TEMP/extended-gh"
      - name: Verify actual sidecar bytes and five signatures against original image bindings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -I -B tools/verify_semantic_extended_evidence.py \
            --sidecar "$RUNNER_TEMP/extended-v2.zip" \
            --sidecar-sha256 d74b1e6406d013272806465b722903a082d63e171948a37e666ae59c45c32d87 \
            --original-bundle "$RUNNER_TEMP/ouf-downloaded-v2-artifact/bundle.zip" \
            --source-merge-commit e56a20aae8f8869bc760fd3b048c152680c1b854 \
            --gh "$RUNNER_TEMP/extended-gh/gh_2.102.0_linux_amd64/bin/gh" \
            --output generated/extended-evidence-readback
      - uses: actions/upload-artifact@v4
        with:
          name: extended-v2-independent-readback-${{ github.run_id }}
          path: generated/extended-evidence-readback/*target*.json
          if-no-files-found: error
          retention-days: 30
