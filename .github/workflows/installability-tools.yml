name: Installation source and IAM scope tools
on:
  pull_request:
    paths:
      - 'scripts/installation/**'
      - '.github/workflows/installability-tools.yml'
  push:
    paths:
      - 'scripts/installation/**'
      - '.github/workflows/installability-tools.yml'
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts/installation -p 'test_*.py' -v
      - run: python scripts/installation/keycloak_scopes.py --desired scripts/installation/keycloak-scopes.example.json --mode plan
      - run: python scripts/installation/checkout_sources.py --root /tmp/ouf-six-checkouts --lock scripts/installation/source-lock.example.json
