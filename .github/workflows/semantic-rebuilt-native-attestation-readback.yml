name: Semantic rebuilt native attestation readback
on:
  pull_request:
    paths:
      - 'tests/read_semantic_rebuilt_native_attestation.py'
      - '.github/workflows/semantic-rebuilt-native-attestation-readback.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  attestations: read
jobs:
  immutable-evidence-readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact rebuilt native audit and signatures
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tests/read_semantic_rebuilt_native_attestation.py
