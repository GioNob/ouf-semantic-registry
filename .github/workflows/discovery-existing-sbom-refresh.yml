name: Refresh unchanged signed discovery SBOM evidence
on:
  push:
    branches: ['codex/discovery-existing-sbom-refresh-20261009']
    paths:
      - '.github/workflows/discovery-existing-sbom-refresh.yml'
      - 'tools/refresh_existing_discovery_sbom.py'
permissions:
  contents: read
  actions: read
  attestations: write
  id-token: write
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: GioNob/ouf-semantic-registry
          ref: 84e91e199892bfda1d116a49f53a9990f61724c7
          path: verification-source
      - name: Verify original signed inputs and scan offline against frozen fresh DB
        env:
          GH_TOKEN: ${{ github.token }}
        run: sudo --preserve-env=GH_TOKEN /usr/bin/python3 -I -B tools/refresh_existing_discovery_sbom.py verification-source
      - name: Make retained public evidence readable
        if: always()
        run: if [ -d generated ]; then sudo chown -R "$(id -u):$(id -g)" generated; sudo chmod -R a+rX generated; fi
      - name: Sign exact refreshed evidence
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-checksums: generated/discovery-existing-sbom-refresh/checksums.sha256
          create-storage-record: false
      - name: Retain bundle and verify fresh signed subjects
        env:
          GH_TOKEN: ${{ github.token }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          sudo cp "$PROVENANCE_BUNDLE" generated/discovery-existing-sbom-refresh/provenance.json
          for subject in inventory.json semantic.syft.json mcp.syft.json semantic.grype.json mcp.grype.json; do
            gh attestation verify "generated/discovery-existing-sbom-refresh/$subject" \
              --repo GioNob/ouf-semantic-registry \
              --signer-workflow GioNob/ouf-semantic-registry/.github/workflows/discovery-existing-sbom-refresh.yml \
              --source-digest "$GITHUB_SHA" --source-ref "$GITHUB_REF" \
              --deny-self-hosted-runners \
              --bundle generated/discovery-existing-sbom-refresh/provenance.json --format json \
              > "generated/discovery-existing-sbom-refresh/$subject.verification.json"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discovery-existing-sbom-refresh-${{ github.run_id }}
          path: generated/discovery-existing-sbom-refresh/
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce actual fresh vulnerability threshold
        run: |
          python -c 'import json; from pathlib import Path; r=json.loads(Path("generated/discovery-existing-sbom-refresh/inventory.json").read_text()); assert r["allScannerSeverityThresholdsMet"], "FRESH_VULNERABILITY_REVIEW_REQUIRED"'
