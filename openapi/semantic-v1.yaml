openapi: 3.1.0
info:
  title: OUF Semantic Registry API
  version: 1.0.0
paths:
  /api/semantic/v1/artifacts:
    post:
      operationId: createSemanticArtifact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              allOf:
                - if: {required: [artifactType], properties: {artifactType: {const: DATATYPE}}}
                  then:
                    required: [definition]
                    properties:
                      definition: {$ref: '../contracts/semantic-reference-v1.json#/$defs/DatatypeDefinition'}
                - $ref: '#/components/schemas/ValueMapProposal'
      responses: {'201': {description: Draft created}}
  /api/semantic/v1/proposal-commands/create:
    post:
      operationId: createSemanticProposal
      x-ouf-mcp-capability: ouf.semantic.propose
      description: The signed owner envelope is limited to 1048576 bytes for VALUE_MAP and 65536 bytes for other proposals.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ValueMapProposal'
                - if: {required: [artifactType], properties: {artifactType: {const: VALUE_MAP}}}
                  then:
                    properties:
                      rationale:
                        description: Proposal metadata outside the definition and its digest.
                        type: object
                        additionalProperties: false
                        properties:
                          sourceColumn: {$ref: './semantic-ths-v1.yaml#/components/schemas/ValueMapSourceColumn'}
                  else:
                    not: {required: [rationale]}
      responses:
        '200':
          description: Draft proposal receipt with current workflow metadata.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProposalObservation'}
        '400': {description: SEMANTIC_VALUE_MAP_INVALID for an invalid value map definition or rationale}
  /api/semantic/v1/proposal-commands/validate:
    post:
      operationId: prepareSemanticProposalReview
      x-ouf-mcp-capability: ouf.semantic.review.prepare
      responses:
        '200':
          description: Validation receipt with current workflow metadata.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProposalObservation'}
  /api/semantic/v1/proposal-commands/review:
    post:
      operationId: requestSemanticProposalApproval
      x-ouf-mcp-capability: ouf.semantic.approval.request
      responses:
        '200':
          description: Challenge receipt with current workflow metadata. The original challenge expiry is also available as expiresAt alongside expires_at.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ProposalObservation'
                  - type: object
                    required: [expiresAt]
                    properties:
                      expiresAt: {type: string, format: date-time}
  /api/semantic/v1/proposal-commands/read:
    post:
      operationId: readSemanticProposal
      x-ouf-mcp-capability: ouf.semantic.proposal.read
      description: >
        The authenticated HUMAN must own the receipt in the same tenant and still hold
        both the read grant and the grant for the original operation. Pass the last observed
        opaque version to compare the current owner state, including HUMAN decisions and
        time-driven expiry. A match returns a compact HTTP 200, without loading the
        historical result into the response. An omitted or different version returns the
        immutable receipt and the current observation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [commandKey]
              properties:
                commandKey: {type: string, pattern: '^[A-Za-z0-9_:.-]{1,128}$'}
                expectedVersion: {$ref: '#/components/schemas/ProposalVersion'}
      responses:
        '200':
          description: Changed or unchanged observation.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ChangedProposal'
                  - $ref: '#/components/schemas/UnchangedProposal'
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /api/internal/v1/semantic/consultation/search-batch:
    post:
      operationId: searchPublishedSemanticBatch
      description: The receipt binds the forwarded bytes. The request limit applies to the UTF-8 envelope after optional gzip decoding.
      x-ouf-mcp-capability: ouf.semantic.search.batch
      x-ouf-tool-eligible: false
      parameters:
        - {in: header, name: X-OUF-Semantic-Read-Receipt, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [Owner, CapabilityID, GatewayBindingRef, OperationClass, Arguments]
              additionalProperties: false
              properties:
                Owner: {const: semantic}
                CapabilityID: {const: ouf.semantic.search.batch}
                GatewayBindingRef: {const: 'capability://ouf.semantic.search.batch'}
                OperationClass: {const: READ}
                MaxResultBytes: {type: integer, minimum: 1}
                Identity: {}
                AuthorizationDecisionRef: {}
                CorrelationID: {}
                IdempotencyKey: {}
                AttemptID: {}
                RequestHash: {}
                Arguments:
                  type: object
                  additionalProperties: false
                  required: [contract, limitPerIntent, intents]
                  properties:
                    contract: {const: ouf.semantic.published-batch.v1}
                    limitPerIntent: {type: integer, minimum: 1, maximum: 8}
                    intents:
                      type: array
                      minItems: 1
                      maxItems: 64
                      items:
                        type: object
                        additionalProperties: false
                        required: [intentId, intent, preferredLanguages, requestedArtifactType, context]
                        properties:
                          intentId: {type: string, pattern: '^[A-Za-z0-9_-]{1,64}$'}
                          intent: {type: string, minLength: 1, maxLength: 256}
                          requestedArtifactType: {type: string, enum: [PROPERTY, CLASS, DATATYPE]}
                          preferredLanguages:
                            type: array
                            minItems: 1
                            maxItems: 5
                            uniqueItems: true
                            items: {type: string, pattern: '^[A-Za-z]{2,8}(?:-[A-Za-z0-9]{1,8}){0,3}$'}
                          context:
                            type: object
                            additionalProperties: false
                            properties:
                              namespace: {type: string, minLength: 1, maxLength: 512}
                              domain: {type: string, minLength: 1, maxLength: 2048}
                              range: {type: string, minLength: 1, maxLength: 2048}
      responses:
        '200':
          description: Results in request order. Uniqueness is evaluated across all visible matches before limiting.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [contract, results]
                properties:
                  contract: {const: ouf.semantic.published-batch.v1}
                  results:
                    type: array
                    minItems: 1
                    maxItems: 64
                    items:
                      type: object
                      additionalProperties: false
                      required: [intentId, state, hasMore, hits]
                      properties:
                        intentId: {type: string, pattern: '^[A-Za-z0-9_-]{1,64}$'}
                        state: {type: string, enum: [MATCH, AMBIGUOUS, NONE]}
                        hasMore: {type: boolean}
                        hits:
                          type: array
                          maxItems: 8
                          items:
                            type: object
                            additionalProperties: false
                            required: [semanticId, semanticVersion, revisionId, publicationSetId, score, reasons]
                            properties:
                              semanticId: {type: string, minLength: 1, maxLength: 2048}
                              semanticVersion: {type: string, minLength: 1, maxLength: 128}
                              revisionId: {type: string, format: uuid}
                              publicationSetId: {type: string, format: uuid}
                              score: {type: integer, enum: [60, 95, 100]}
                              reasons:
                                type: array
                                minItems: 1
                                maxItems: 4
                                uniqueItems: true
                                items: {type: string, enum: [EXACT_LABEL, EXACT_LOCAL_NAME, LABEL_PREFIX, PREFERRED_LANGUAGE, CONTEXT_MATCH]}
        '400': {description: SEM_BATCH_ARGUMENTS_INVALID}
        '403': {description: SEM_READ_RECEIPT_OR_POLICY_DENIED}
        '413': {description: SEM_BATCH_REQUEST_TOO_LARGE}
        '422': {description: SEM_BATCH_RESULT_TOO_LARGE}
        '429': {description: SEM_BATCH_RATE_LIMITED}
        '503': {description: SEM_BATCH_UNAVAILABLE}
  /api/internal/v1/semantic/discovery/request:
    post:
      operationId: requestDelegatedSemanticDiscovery
      x-ouf-mcp-capability: ouf.semantic.discovery
      responses:
        '200':
          description: Current discovery job. An idempotent replay returns the current observation.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DiscoveryObservation'}
  /api/internal/v1/semantic/discovery/status:
    post:
      operationId: readDelegatedSemanticDiscoveryStatus
      x-ouf-mcp-capability: ouf.semantic.discovery.status
      responses:
        '200':
          description: Current discovery job.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DiscoveryObservation'}
  /api/internal/v1/semantic/discovery/candidates:
    post:
      operationId: readDelegatedSemanticDiscoveryCandidates
      x-ouf-mcp-capability: ouf.semantic.discovery.candidates
      description: >
        Set Arguments.includeState to true in the signed Gateway envelope to receive
        the job observation alongside candidates, including when the list is empty.
        The historical array is returned when includeState is false or omitted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [Arguments]
              properties:
                Arguments:
                  type: object
                  additionalProperties: false
                  required: [requestId]
                  properties:
                    requestId: {type: string, format: uuid}
                    includeState: {type: boolean, default: false}
      responses:
        '200':
          description: Candidate array or job observation with eligible candidate IDs.
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: {type: object}
                  - allOf:
                      - $ref: '#/components/schemas/DiscoveryObservation'
                      - type: object
                        required: [candidates, adoptableCandidateIds]
                        properties:
                          candidates: {type: array, items: {type: object}}
                          adoptableCandidateIds: {type: array, items: {type: string, format: uuid}}
  /api/semantic/v1/artifacts/{id}:
    get: {operationId: getSemanticArtifact, responses: {'200': {description: Artifact detail}}}
  /api/semantic/v1/search:
    get: {operationId: searchSemanticArtifacts, responses: {'200': {description: Search results}}}
  /api/semantic/v1/revisions/{id}:
    patch:
      operationId: editSemanticDraft
      description: Edit a DRAFT under If-Match; adopted candidates can explicitly set their semantic version before validation and publication.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                labels: {type: object}
                definition: {type: object}
                semanticVersion: {type: string, example: '1.0.0'}
      responses:
        '200': {description: Draft updated}
        '409': {description: Revision is not DRAFT or optimistic version is stale}
  /api/semantic/v1/revisions/{id}:validate:
    post: {operationId: validateSemanticRevision, responses: {'200': {description: Validation result}}}
  /api/semantic/v1/validation-runs/{id}:
    get: {operationId: getSemanticValidation, responses: {'200': {description: Validation evidence}}}
  /api/semantic/v1/impact-reports:
    post: {operationId: createSemanticImpactReport, responses: {'200': {description: Impact report}}}
  /api/semantic/v1/impact-reports/{id}:
    get: {operationId: getSemanticImpactReport, responses: {'200': {description: Impact report}}}
  /api/semantic/v1/references:resolve:
    get:
      operationId: resolveSemanticReference
      parameters:
        - {name: semanticId, in: query, required: true, schema: {type: string, format: uri}}
        - {name: publicationSetId, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: revisionId, in: query, description: Optional only for a pinned DATATYPE or VALUE_MAP, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Exact publication member with the current status of its pinned revision. Onboarding requires ACTIVE for every DATATYPE and VALUE_MAP during preparation and resolves each nested pin separately. Historical replay accepts all three published states.
          content:
            application/json:
              schema:
                type: object
                required: [semantic_id, revision_id, publication_set_id, artifact_type, status]
                properties:
                  semantic_id: {type: string}
                  revision_id: {type: string, format: uuid}
                  publication_set_id: {type: string, format: uuid}
                  artifact_type: {type: string}
                  status: {$ref: '../contracts/semantic-reference-v1.json#/properties/status'}
                allOf:
                  - if: {properties: {artifact_type: {enum: [DATATYPE, VALUE_MAP]}}}
                    then:
                      required: [definition, definitionSha256]
                      properties:
                        definitionSha256: {$ref: '../contracts/semantic-reference-v1.json#/properties/definitionSha256'}
                  - if: {properties: {artifact_type: {const: DATATYPE}}}
                    then:
                      properties:
                        definition: {$ref: '../contracts/semantic-reference-v1.json#/$defs/DatatypeDefinition'}
                  - if: {properties: {artifact_type: {const: VALUE_MAP}}}
                    then:
                      properties:
                        definition: {$ref: '../contracts/semantic-reference-v1.json#/$defs/ValueMapDefinition'}
  /api/semantic/v1/references:resolve-batch:
    post:
      operationId: resolveSemanticReferenceBatch
      summary: Resolve exact published pins in request order
      description: >-
        Idempotent M2M read using the same ouf.semantic.read capability, tenant context
        and publication visibility as the single-reference GET. Each pin has one outcome.
        The default limits are 262144 request bytes and 1024 pins, configurable with
        OUF_SEM_REFERENCE_BATCH_MAX_REQUEST_BYTES and OUF_SEM_REFERENCE_BATCH_MAX_ITEMS.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [references]
              properties:
                references:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  description: The installation limits the number of pins. UUID equality is case-insensitive.
                  items:
                    $ref: '../contracts/semantic-reference-batch-v1.json#/$defs/pin'
                    unevaluatedProperties: false
      responses:
        '200':
          description: >-
            Zero-based indices preserve request order. An absent or invisible pin produces
            NOT_RESOLVABLE. RESOLVED projects the compact GET fields and the D-084 hash for
            DATATYPE and VALUE_MAP, and for CONCEPT the same definition as the GET (with vocabularyRef,
            the vocabulary membership checked by Ingestion and UDP). All chunks at the same registry state share registryVersion.
            The query fingerprints each revision ID and lifecycle state and each publication
            set ID, state and checksum, XORs the fixed-width fingerprints per table, and hashes
            the two aggregates in the same PostgreSQL snapshot as the result rows.
          content:
            application/json:
              schema: {$ref: '../contracts/semantic-reference-batch-v1.json'}
        '400':
          description: Invalid request. Index identifies the first invalid pin or is zero for envelope errors.
          content:
            application/json:
              schema:
                type: object
                required: [code, index, reason]
                properties:
                  code: {const: SEM_REFERENCE_BATCH_INVALID}
                  index: {type: integer, minimum: 0}
                  reason: {enum: [INVALID_ENVELOPE, INVALID_JSON, EMPTY_REFERENCES, INVALID_ELEMENT, MISSING_FIELD, INVALID_FIELD_TYPE, INVALID_SEMANTIC_ID, INVALID_UUID, UNKNOWN_FIELD, DUPLICATE_REFERENCE]}
        '401': {description: Authentication required by IAM}
        '403': {description: Caller lacks the required read capability in the current context}
        '413':
          description: The byte or item limit was exceeded. Reduce the chunk size.
          content:
            application/json:
              schema:
                type: object
                required: [code]
                properties:
                  code: {const: SEM_REFERENCE_BATCH_TOO_LARGE}
  /api/semantic/v1/consumer-references:
    put: {operationId: registerSemanticConsumerReference, responses: {'204': {description: Registered}}}
  /api/semantic/v1/discovery:
    post: {operationId: createSemanticDiscovery, responses: {'200': {description: Discovery queued}}}
  /api/semantic/v1/discovery/{id}/candidates:
    get: {operationId: listSemanticCandidates, responses: {'200': {description: Temporary candidates}}}
  /api/semantic/v1/discovery/{requestId}/candidates/{candidateId}:adopt:
    post: {operationId: adoptSemanticCandidate, responses: {'200': {description: Candidate adopted as draft}}}
  /api/semantic/v1/discovery/providers:
    get: {operationId: listSemanticProviders, responses: {'200': {description: Provider status}}}
  /api/semantic/v1/imports:
    post: {operationId: importSemanticArtifact, responses: {'200': {description: RDF imported}}}
  /api/semantic/v1/publication-sets/{setId}/artifacts/{artifactId}:
    get: {operationId: exportPublishedSemanticArtifact, responses: {'200': {description: Immutable RDF representation}}}
  /api/semantic/v1/change-notices:
    post: {operationId: createSemanticChangeNotice, responses: {'200': {description: Change notice}}}
  /api/semantic/v1/change-notices/{id}:
    get: {operationId: getSemanticChangeNotice, responses: {'200': {description: Change notice}}}
  /api/semantic/v1/migration-proposals:
    post: {operationId: createSemanticMigrationProposal, responses: {'200': {description: Proposal}}}
  /api/semantic/v1/migration-proposals/{id}:
    get: {operationId: getSemanticMigrationProposal, responses: {'200': {description: Proposal}}}
  /api/semantic/v1/approval-challenges:
    post:
      operationId: createSemanticApprovalChallenge
      summary: Submit a validated revision and return a trusted-human handoff reference
      x-ouf-mcp-capability: ouf.semantic.approval.request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revisionId, contentHash]
              properties:
                revisionId: {type: string, format: uuid}
                contentHash: {type: string, pattern: '^[0-9a-f]{64}$'}
      responses:
        '201':
          description: Challenge created; no approval has been granted
          content:
            application/json:
              schema:
                type: object
                required: [challengeId, trustedApprovalRef, humanAuthorityRequired]
                properties:
                  challengeId: {type: string, format: uuid}
                  trustedApprovalRef: {type: string}
                  humanAuthorityRequired: {type: boolean, const: true}
        '403': {$ref: '#/components/responses/Problem'}
components:
  responses:
    Problem:
      description: RFC 9457 problem detail
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    AllowedWorkflowAction:
      description: State-dependent action. Commands still require authorization and current owner preconditions. NONE is returned by itself.
      type: string
      enum: [POLL_DISCOVERY, LIST_CANDIDATES, ADOPT_CANDIDATE, PREPARE_REVIEW, REQUEST_APPROVAL, WAIT_HUMAN_DECISION, REVISE_PROPOSAL, NONE]
    DiscoveryObservation:
      description: >
        PENDING and RUNNING with ACTIVE or RETRY_WAIT advertise POLL_DISCOVERY.
        pollAfterSeconds is at least five and respects the persisted next attempt.
        SUCCEEDED with unexpired candidates advertises LIST_CANDIDATES on request/status;
        the stateful candidates response advertises ADOPT_CANDIDATE if there are still
        eligible candidate IDs. Eligible IDs identify unexpired candidates not already
        adopted from this job. All other combinations advertise NONE.
      type: object
      required: [requestId, state, recoveryState, allowedActions]
      properties:
        requestId: {type: string, format: uuid}
        state: {type: string, enum: [PENDING, RUNNING, SUCCEEDED, FAILED, CANCELLED]}
        completedCandidateCount:
          type: integer
          minimum: 0
          description: Immutable count attested at successful publication. Absent for jobs without owner evidence.
        recoveryState: {type: string, enum: [ACTIVE, RETRY_WAIT, PAUSED_EXHAUSTED, BLOCKED, CANCELLED]}
        excludedCandidates:
          type: object
          description: Counts published with the successful attempt. Consumers may encounter additional reasons.
          properties:
            CANDIDATE_NAMESPACE_EXCLUDED:
              type: integer
              minimum: 0
              description: Required description or optional provenance GETs skipped by the namespace filter.
          additionalProperties: {type: integer, minimum: 0}
        errorCode:
          type: string
          description: >
            SEM_DISCOVERY_RATE_LIMITED reports HTTP 429 with unattested origin.
            While retrying, nextAttemptAt respects both Retry-After and the durable backoff.
            Provider timeouts and HTTP 5xx use SEM_DISCOVERY_PROVIDER_FAILED.
        allowedActions:
          type: array
          minItems: 1
          maxItems: 1
          items:
            allOf:
              - $ref: '#/components/schemas/AllowedWorkflowAction'
              - enum: [POLL_DISCOVERY, LIST_CANDIDATES, ADOPT_CANDIDATE, NONE]
        pollAfterSeconds: {type: integer, minimum: 5}
    ProposalVersion:
      description: Opaque equality token for the current observation. Use rowVersion for optimistic writes.
      type: string
      pattern: '^[a-f0-9]{64}$'
    ProposalProgress:
      description: >
        DRAFT allows PREPARE_REVIEW. VALIDATED refers to green evidence for the current
        row and allows REQUEST_APPROVAL. VALIDATION_FAILED, REJECTED and EXPIRED allow
        REVISE_PROPOSAL. UNDER_REVIEW allows WAIT_HUMAN_DECISION and recommends a
        five-second poll. APPROVED denotes the HUMAN decision; publication is a
        separate HUMAN action in THS. APPROVED, ACTIVE, DEPRECATED, RETIRED and
        UNKNOWN advertise NONE. UNKNOWN covers legacy receipts without a verifiable
        revision and inconsistent review metadata.
      type: object
      required: [version, state, allowedActions]
      properties:
        version: {$ref: '#/components/schemas/ProposalVersion'}
        state: {type: string, enum: [DRAFT, VALIDATED, VALIDATION_FAILED, UNDER_REVIEW, APPROVED, REJECTED, EXPIRED, ACTIVE, DEPRECATED, RETIRED, UNKNOWN]}
        allowedActions:
          type: array
          minItems: 1
          maxItems: 1
          items:
            allOf:
              - $ref: '#/components/schemas/AllowedWorkflowAction'
              - enum: [PREPARE_REVIEW, REQUEST_APPROVAL, WAIT_HUMAN_DECISION, REVISE_PROPOSAL, NONE]
        pollAfterSeconds: {type: integer, minimum: 5}
    ProposalObservation:
      allOf:
        - $ref: '#/components/schemas/ProposalProgress'
        - type: object
          properties:
            revisionId: {type: string, format: uuid}
            rowVersion: {type: integer, minimum: 0}
            currentValidationRunId: {type: string, format: uuid}
            currentChallenge:
              type: object
              required: [challengeId, challengeStatus, expiresAt]
              properties:
                challengeId: {type: string, format: uuid}
                challengeStatus: {type: string, enum: [OPEN, APPROVED, REJECTED, EXPIRED]}
                expiresAt: {type: string, format: date-time}
                reviewUrl:
                  description: Owner-issued THS workflow-review URL for the semantic flow, returned for open or approved review when the public THS origin is configured.
                  type: string
                  format: uri
    ChangedProposal:
      allOf:
        - $ref: '#/components/schemas/ProposalObservation'
        - type: object
          required: [changed, operation, result, historicalSnapshot, ownerStateMustBeRechecked]
          properties:
            changed: {const: true}
            operation: {type: string, enum: [CREATE, VALIDATE, REVIEW, ADOPT]}
            result: {type: object, description: Immutable command receipt. Use the top-level observation for current state.}
            historicalSnapshot: {const: true}
            ownerStateMustBeRechecked: {const: true}
    UnchangedProposal:
      allOf:
        - $ref: '#/components/schemas/ProposalProgress'
        - type: object
          required: [changed]
          properties:
            changed: {const: false}
      unevaluatedProperties: false
    ValueMapProposal:
      type: object
      if: {required: [artifactType], properties: {artifactType: {const: VALUE_MAP}}}
      then:
        required: [definition]
        properties:
          definition: {$ref: '../contracts/semantic-reference-v1.json#/$defs/ValueMapDefinition'}
        not:
          anyOf:
            - required: [rdfTurtle]
            - required: [mediaType]
    Problem:
      type: object
      required: [status, detail, code, correlationId]
      properties:
        status: {type: integer}
        detail: {type: string}
        code: {type: string}
        correlationId: {type: string}
