openapi: 3.1.0
info:
  title: OUF Semantic Registry API
  version: 1.0.0
paths:
  /api/semantic/v1/artifacts:
    post: {operationId: createSemanticArtifact, responses: {'201': {description: Draft created}}}
  /api/semantic/v1/artifacts/{id}:
    get: {operationId: getSemanticArtifact, responses: {'200': {description: Artifact detail}}}
  /api/semantic/v1/search:
    get:
      operationId: searchSemanticArtifacts
      description: Internal search only. ACTIVE returns the current published revision with an exact revision/publication pin. Non-ACTIVE reads retain the additional draft/review authorization guard.
      parameters:
        - {name: q, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 256}}
        - {name: status, in: query, schema: {type: string, enum: [ACTIVE, DEPRECATED, RETIRED, DRAFT, UNDER_REVIEW], default: ACTIVE}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: type, in: query, schema: {type: string, enum: [CLASS, PROPERTY, RELATIONSHIP, VOCABULARY, CONCEPT, ONTOLOGY]}}
        - {name: namespace, in: query, schema: {type: string, minLength: 1, maxLength: 512}}
        - {name: domain, in: query, schema: {type: string, minLength: 1, maxLength: 2048}}
        - {name: range, in: query, schema: {type: string, minLength: 1, maxLength: 2048}}
      responses:
        '200': {description: Ranked results with native JSON label/description/definition and publication checksum; no external provider call}
        '400': {description: Invalid input or response exceeds the configured owner byte limit}
        '403': {$ref: '#/components/responses/Problem'}
  /api/semantic/v1/revisions/{id}:
    patch:
      operationId: editSemanticDraft
      description: Edit a DRAFT under If-Match; adopted candidates can explicitly set their semantic version before validation and publication.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                labels: {type: object}
                definition: {type: object}
                semanticVersion: {type: string, example: '1.0.0'}
      responses:
        '200': {description: Draft updated}
        '409': {description: Revision is not DRAFT or optimistic version is stale}
  /api/semantic/v1/revisions/{id}:validate:
    post: {operationId: validateSemanticRevision, responses: {'200': {description: Validation result}}}
  /api/semantic/v1/validation-runs/{id}:
    get: {operationId: getSemanticValidation, responses: {'200': {description: Validation evidence}}}
  /api/semantic/v1/impact-reports:
    post: {operationId: createSemanticImpactReport, responses: {'200': {description: Impact report}}}
  /api/semantic/v1/impact-reports/{id}:
    get: {operationId: getSemanticImpactReport, responses: {'200': {description: Impact report}}}
  /api/semantic/v1/references:resolve:
    get:
      operationId: resolveSemanticReference
      description: Exact immutable publication membership. Never substitutes the latest or ACTIVE revision. Historical RETIRED refs remain readable for audit. Definition includes domain/range, datatype, vocabulary and constraint metadata as published.
      parameters:
        - {name: semanticId, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 2048}}
        - {name: revisionId, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: publicationSetId, in: query, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Exact detail with JSON label/description/definition, content and publication checksum, ownership/provenance kind and up to 100 dependencies; dependencies_partial signals overflow}
        '400': {description: Invalid input or response exceeds the configured owner byte limit}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {description: Exact reference absent from the specified PUBLISHED set}
  /api/semantic/v1/consumer-references:
    put: {operationId: registerSemanticConsumerReference, responses: {'204': {description: Registered}}}
  /api/semantic/v1/discovery:
    post: {operationId: createSemanticDiscovery, responses: {'200': {description: Discovery queued}}}
  /api/semantic/v1/discovery/{id}/candidates:
    get: {operationId: listSemanticCandidates, responses: {'200': {description: Temporary candidates}}}
  /api/semantic/v1/discovery/{requestId}/candidates/{candidateId}:adopt:
    post: {operationId: adoptSemanticCandidate, responses: {'200': {description: Candidate adopted as draft}}}
  /api/semantic/v1/discovery/providers:
    get: {operationId: listSemanticProviders, responses: {'200': {description: Provider status}}}
  /api/semantic/v1/imports:
    post: {operationId: importSemanticArtifact, responses: {'200': {description: RDF imported}}}
  /api/semantic/v1/publication-sets/{setId}/artifacts/{artifactId}:
    get: {operationId: exportPublishedSemanticArtifact, responses: {'200': {description: Immutable RDF representation}}}
  /api/semantic/v1/change-notices:
    post: {operationId: createSemanticChangeNotice, responses: {'200': {description: Change notice}}}
  /api/semantic/v1/change-notices/{id}:
    get: {operationId: getSemanticChangeNotice, responses: {'200': {description: Change notice}}}
  /api/semantic/v1/migration-proposals:
    post: {operationId: createSemanticMigrationProposal, responses: {'200': {description: Proposal}}}
  /api/semantic/v1/migration-proposals/{id}:
    get: {operationId: getSemanticMigrationProposal, responses: {'200': {description: Proposal}}}
  /api/semantic/v1/approval-challenges:
    post:
      operationId: createSemanticApprovalChallenge
      summary: Submit a validated revision and return a trusted-human handoff reference
      x-ouf-mcp-capability: ouf.semantic.approval.request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revisionId, contentHash]
              properties:
                revisionId: {type: string, format: uuid}
                contentHash: {type: string, pattern: '^[0-9a-f]{64}$'}
      responses:
        '201':
          description: Challenge created; no approval has been granted
          content:
            application/json:
              schema:
                type: object
                required: [challengeId, trustedApprovalRef, humanAuthorityRequired]
                properties:
                  challengeId: {type: string, format: uuid}
                  trustedApprovalRef: {type: string}
                  humanAuthorityRequired: {type: boolean, const: true}
        '403': {$ref: '#/components/responses/Problem'}
components:
  responses:
    Problem:
      description: RFC 9457 problem detail
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    Problem:
      type: object
      required: [status, detail, code, correlationId]
      properties:
        status: {type: integer}
        detail: {type: string}
        code: {type: string}
        correlationId: {type: string}
